<!DOCTYPE html>
<html>

<head>

    <title>Delete Expense</title>

</head>

<body>

    <h2>Delete Expense</h2>

    <p>
        Are you sure you want to delete:
    </p>

    <strong>
        {{ expense.title }}
    </strong>

    <p>
        Amount: ₹{{ expense.amount }}
    </p>


    <form method="POST">

        {% csrf_token %}

        <button type="submit">
            Yes, Delete
        </button>

        <a href="{% url 'expense_list' %}">
            Cancel
        </a>

    </form>

</body>

</html>
