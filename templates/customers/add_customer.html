<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Add Customer</title>

    <style>

        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            background: #f5f7fb;
            padding: 30px;
        }

        .container {
            max-width: 700px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
        }

        h1 {
            margin-bottom: 8px;
        }

        .subtitle {
            color: #64748b;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-size: 14px;
            font-weight: 600;
        }

        input,
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 7px;
            outline: none;
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        input:focus,
        textarea:focus {
            border-color: #2563eb;
        }

        .buttons {
            display: flex;
            gap: 10px;
            margin-top: 25px;
        }

        button,
        .cancel {
            padding: 12px 20px;
            border-radius: 7px;
            cursor: pointer;
            text-decoration: none;
            font-size: 14px;
        }

        button {
            border: none;
            background: #2563eb;
            color: white;
        }

        .cancel {
            background: #e2e8f0;
            color: #334155;
        }

    </style>

</head>

<body>

<div class="container">

    <h1>Add Customer</h1>

    <p class="subtitle">
        Add a new customer to your business.
    </p>


    <form method="POST">

        {% csrf_token %}


        <div class="form-group">

            <label>Customer Name</label>

            <input
                type="text"
                name="name"
                placeholder="Enter customer name"
                required
            >

        </div>


        <div class="form-group">

            <label>Phone Number</label>

            <input
                type="text"
                name="phone"
                placeholder="Enter phone number"
                required
            >

        </div>


        <div class="form-group">

            <label>Email</label>

            <input
                type="email"
                name="email"
                placeholder="Enter email"
            >

        </div>


        <div class="form-group">

            <label>Address</label>

            <textarea
                name="address"
                placeholder="Enter customer address"
            ></textarea>

        </div>


        <div class="form-group">

            <label>Follow-up Date</label>

            <input
                type="date"
                name="follow_up_date"
            >

        </div>


        <div class="form-group">

            <label>Notes</label>

            <textarea
                name="notes"
                placeholder="Add notes about this customer"
            ></textarea>

        </div>


        <div class="buttons">

            <button type="submit">
                Save Customer
            </button>

            <a
                href="{% url 'customer_list' %}"
                class="cancel"
            >
                Cancel
            </a>

        </div>

    </form>

</div>

</body>

</html>
