<!DOCTYPE html>
<html>

<head>

    <title>Invoices</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 1200px;
            margin: auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .header h1 {
            margin: 0;
        }

        .btn {
            display: inline-block;
            padding: 10px 16px;
            background: #2563eb;
            color: white;
            text-decoration: none;
            border-radius: 6px;
        }

        .search-box {
            margin-bottom: 20px;
        }

        .search-box input {
            width: 300px;
            padding: 11px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        .search-box button {
            padding: 11px 18px;
            background: #111827;
            color: white;
            border: none;
            border-radius: 6px;
        }

        table {
            width: 100%;
            background: white;
            border-collapse: collapse;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.08);
        }

        th,
        td {
            padding: 14px;
            border-bottom: 1px solid #eee;
            text-align: left;
        }

        th {
            background: #f9fafb;
        }

        .view-btn {
            color: #2563eb;
            text-decoration: none;
        }

        @media (max-width: 700px) {

            body {
                padding: 15px;
            }

            .header {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }

            .search-box input {
                width: 65%;
            }

            table {
                font-size: 13px;
            }

        }

    </style>

</head>

<body>

<div class="container">

    <div class="header">

        <h1>Invoices</h1>

        <a
            href="{% url 'create_invoice' %}"
            class="btn"
        >
            + Create Invoice
        </a>

    </div>


    <form
        method="GET"
        class="search-box"
    >

        <input
            type="text"
            name="search"
            placeholder="Search invoice or customer..."
            value="{{ search }}"
        >

        <button type="submit">
            Search
        </button>

    </form>


    <table>

        <thead>

            <tr>

                <th>Invoice No.</th>

                <th>Customer</th>

                <th>Date</th>

                <th>Total</th>

                <th>Status</th>

                <th>Action</th>

            </tr>

        </thead>


        <tbody>

        {% for invoice in invoices %}

            <tr>

                <td>
                    {{ invoice.invoice_number }}
                </td>

                <td>
                    {{ invoice.customer.name }}
                </td>

                <td>
                    {{ invoice.invoice_date }}
                </td>

                <td>
                    ₹{{ invoice.grand_total }}
                </td>

                <td>
                    {{ invoice.get_status_display }}
                </td>

                <td>

                    <a
                        href="{% url 'invoice_detail' invoice.id %}"
                        class="view-btn"
                    >
                        View
                    </a>

                </td>

            </tr>

        {% empty %}

            <tr>

                <td colspan="6">
                    No invoices found.
                </td>

            </tr>

        {% endfor %}

        </tbody>

    </table>

</div>

</body>

</html>
