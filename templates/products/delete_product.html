<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Delete Product</title>

    <style>

        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            background: #f5f7fb;
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .box {
            width: 90%;
            max-width: 450px;

            background: white;

            padding: 35px;

            border-radius: 12px;

            text-align: center;

            border: 1px solid #e2e8f0;
        }

        h2 {
            margin-bottom: 10px;
        }

        p {
            color: #64748b;
            margin-bottom: 25px;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 10px;
        }

        button,
        a {
            padding: 11px 18px;
            border-radius: 7px;
            font-size: 14px;
        }

        button {
            border: none;
            background: #dc2626;
            color: white;
            cursor: pointer;
        }

        a {
            text-decoration: none;
            background: #e2e8f0;
            color: #334155;
        }

    </style>

</head>


<body>

<div class="box">

    <h2>Delete Product?</h2>

    <p>

        Are you sure you want to delete

        <strong>
            {{ product.name }}
        </strong>

        ?

    </p>


    <div class="buttons">


        <form method="POST">

            {% csrf_token %}

            <button type="submit">
                Yes, Delete
            </button>

        </form>


        <a href="{% url 'product_list' %}">
            Cancel
        </a>


    </div>

</div>

</body>

</html>
