<!DOCTYPE html>
<html>

<head>

    <title>Edit Expense</title>

    <style>

        body {
            font-family: Arial;
            background: #f5f7fb;
            padding: 30px;
        }

        .box {
            max-width: 550px;
            margin: auto;
            background: white;
            padding: 30px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 6px;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 11px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            margin-top: 20px;
            padding: 12px;
            border: none;
            background: #2563eb;
            color: white;
        }

    </style>

</head>

<body>

<div class="box">

    <h1>Edit Expense</h1>

    <form method="POST">

        {% csrf_token %}


        <label>Title</label>

        <input
            type="text"
            name="title"
            value="{{ expense.title }}"
            required
        >


        <label>Category</label>

        <select
            name="category"
            required
        >

            <option
                value="rent"
                {% if expense.category == 'rent' %}selected{% endif %}
            >
                Rent
            </option>

            <option
                value="salary"
                {% if expense.category == 'salary' %}selected{% endif %}
            >
                Salary
            </option>

            <option
                value="electricity"
                {% if expense.category == 'electricity' %}selected{% endif %}
            >
                Electricity
            </option>

            <option
                value="marketing"
                {% if expense.category == 'marketing' %}selected{% endif %}
            >
                Marketing
            </option>

            <option
                value="transport"
                {% if expense.category == 'transport' %}selected{% endif %}
            >
                Transport
            </option>

            <option
                value="office"
                {% if expense.category == 'office' %}selected{% endif %}
            >
                Office
            </option>

            <option
                value="other"
                {% if expense.category == 'other' %}selected{% endif %}
            >
                Other
            </option>

        </select>


        <label>Amount</label>

        <input
            type="number"
            name="amount"
            value="{{ expense.amount }}"
            step="0.01"
            min="0"
            required
        >


        <label>Expense Date</label>

        <input
            type="date"
            name="expense_date"
            value="{{ expense.expense_date|date:'Y-m-d' }}"
            required
        >


        <label>Description</label>

        <textarea
            name="description"
            rows="4"
        >{{ expense.description }}</textarea>


        <button type="submit">
            Update Expense
        </button>

    </form>

</div>

</body>

</html>
