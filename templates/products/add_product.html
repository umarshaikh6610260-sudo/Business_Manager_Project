<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Add Product</title>

    <style>

        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            background: #f5f7fb;
            padding: 30px;
        }

        .container {
            max-width: 750px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
        }

        h1 {
            margin-bottom: 8px;
        }

        .subtitle {
            color: #64748b;
            margin-bottom: 25px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
        }

        .form-group {
            margin-bottom: 5px;
        }

        .full {
            grid-column: 1 / -1;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-size: 14px;
            font-weight: 600;
        }

        input,
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 7px;
            outline: none;
        }

        input:focus,
        textarea:focus {
            border-color: #2563eb;
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        .buttons {
            display: flex;
            gap: 10px;
            margin-top: 25px;
        }

        button,
        .cancel {
            padding: 12px 20px;
            border-radius: 7px;
            text-decoration: none;
            font-size: 14px;
        }

        button {
            border: none;
            background: #2563eb;
            color: white;
            cursor: pointer;
        }

        .cancel {
            background: #e2e8f0;
            color: #334155;
        }

        @media (max-width: 600px) {

            body {
                padding: 15px;
            }

            .container {
                padding: 20px;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .full {
                grid-column: auto;
            }

        }

    </style>

</head>


<body>

<div class="container">

    <h1>Add Product</h1>

    <p class="subtitle">
        Add a product to your inventory.
    </p>


    <form method="POST">

        {% csrf_token %}


        <div class="form-grid">


            <div class="form-group">

                <label>Product Name</label>

                <input
                    type="text"
                    name="name"
                    placeholder="e.g. Wireless Mouse"
                    required
                >

            </div>


            <div class="form-group">

                <label>SKU</label>

                <input
                    type="text"
                    name="sku"
                    placeholder="e.g. WM001"
                    required
                >

            </div>


            <div class="form-group">

                <label>Category</label>

                <input
                    type="text"
                    name="category"
                    placeholder="e.g. Electronics"
                >

            </div>


            <div class="form-group">

                <label>Purchase Price</label>

                <input
                    type="number"
                    name="purchase_price"
                    step="0.01"
                    min="0"
                    placeholder="0.00"
                    required
                >

            </div>


            <div class="form-group">

                <label>Selling Price</label>

                <input
                    type="number"
                    name="selling_price"
                    step="0.01"
                    min="0"
                    placeholder="0.00"
                    required
                >

            </div>


            <div class="form-group">

                <label>Stock Quantity</label>

                <input
                    type="number"
                    name="stock"
                    min="0"
                    placeholder="0"
                    required
                >

            </div>


            <div class="form-group">

                <label>Minimum Stock</label>

                <input
                    type="number"
                    name="minimum_stock"
                    min="0"
                    value="5"
                    required
                >

            </div>


            <div class="form-group full">

                <label>Description</label>

                <textarea
                    name="description"
                    placeholder="Product description..."
                ></textarea>

            </div>


        </div>


        <div class="buttons">

            <button type="submit">
                Save Product
            </button>

            <a
                href="{% url 'product_list' %}"
                class="cancel"
            >
                Cancel
            </a>

        </div>

    </form>

</div>

</body>

</html>
